[versions]
minSDK = "28"
compileSDK = "37"
androidGradlePlugin = "9.3.2"
kotlin = "2.4.10"
sqldelight = "2.3.2"
coroutines = "1.11.0"
skie = "0.10.14"
compose = "1.12.0"
# org.jetbrains.compose.material3:material3 tracks its OWN version line, not the
# composeMultiplatform version (there is no material3:1.11.1). This is the version
# the CMP 1.12.0 release notes bundle — https://github.com/JetBrains/compose-multiplatform/releases/tag/v1.12.0
# (Material / Runtime / UI / Foundation are all :1.12.0; Material3 is :1.12.0-alpha03).
material3 = "1.12.0-alpha03"
lifecycle = "2.11.0"
calendar = "2.10.1"
reorderable = "3.1.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-common", version.ref = "kotlin" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.8.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
calendar-compose = { module = "com.kizitonwose.calendar:compose-multiplatform", version.ref = "calendar" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Compose Multiplatform's v2 UI test API (runComposeUiTest); call sites need
# @OptIn(ExperimentalTestApi::class).
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
# Android Studio's @Preview renderer. compose.uiTooling (the compose plugin's
# DSL accessor) is deprecated in favor of this explicit coordinate.
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
# The @Preview annotation itself (androidx.compose.ui.tooling.preview.Preview).
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
# Explicit CMP module coordinates (REFERENCE/VibeTrip style) — the compose plugin's
# `compose.runtime`/`.foundation`/`.material3`/`.ui`/`.components.resources` DSL
# accessors are deprecated. `compose-ui-core` (not `compose-ui`) avoids a catalog
# accessor collision with the `compose-ui-*` group above. material3 uses its own ref.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui-core = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
