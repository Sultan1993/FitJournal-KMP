[versions]
minSDK = "26"
compileSDK = "34"
library-group = "kz.maestrosultan.fitjournal.kmp"
library-version = "0.0.1"
androidGradlePlugin = "8.1.2"
kotlin = "1.9.10"
ksp = "1.9.10-1.0.13"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-common", version.ref = "kotlin" }
android-tools-desugaring = "com.android.tools:desugar_jdk_libs:2.0.3"

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
multiplatform-swiftpackage = { id = "io.github.luca992.multiplatform-swiftpackage", version = "2.2.0" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
